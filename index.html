
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Calc | Advanced Studio</title>

<style>
:root {
    --bg: #0b0e14;
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --accent: #00f2ff;
    --accent-glow: rgba(0, 242, 255, 0.3);
    --danger: #ff4b5c;
    --text: #e0e0e0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #1a1c2c 0%, #0b0e14 100%);
    color: var(--text);
}

.calc-card {
    width: 420px;
    background: var(--glass);
    backdrop-filter: blur(30px);
    border: 1px solid var(--glass-border);
    border-radius: 40px;
    padding: 30px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.8),
                inset 0 0 20px rgba(255,255,255,0.02);
}

.nav-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    background: rgba(0,0,0,0.4);
    padding: 6px;
    border-radius: 20px;
}

.nav-tabs button {
    flex: 1;
    background: transparent;
    border: none;
    color: #666;
    padding: 10px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    border-radius: 15px;
}

.nav-tabs button.active {
    color: var(--accent);
    background: rgba(255,255,255,0.05);
}

.screen {
    background: rgba(0,0,0,0.3);
    border-radius: 25px;
    padding: 20px;
    margin-bottom: 30px;
    text-align: right;
}

#history {
    font-size: 14px;
    color: var(--accent);
    opacity: 0.7;
    min-height: 20px;
}

#output {
    font-size: 42px;
}

.button-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.btn {
    height: 60px;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
}

.btn:hover {
    border-color: var(--accent);
}

.btn-ac { color: var(--danger); }
.btn-op { color: var(--accent); }
.btn-eq {
    background: var(--accent);
    color: black;
    font-weight: bold;
}

.stats-field {
    grid-column: span 4;
    padding: 15px;
    border-radius: 20px;
}
</style>
</head>

<body>

<div class="calc-card">

<div class="nav-tabs">
    <button onclick="changePhase('sci')" class="active" id="tab-sci">Scientific</button>
    <button onclick="changePhase('trig')" id="tab-trig">Trig</button>
    <button onclick="changePhase('stats')" id="tab-stats">Statistics</button>
</div>

<div class="screen">
    <div id="history"></div>
    <div id="output">0</div>
</div>

<!-- SCIENTIFIC -->
<div id="phase-sci" class="button-grid phase">

<button class="btn btn-ac" onclick="reset()">AC</button>
<button class="btn btn-op" onclick="backspace()">⌫</button>
<button class="btn btn-op" onclick="math('log')">log₁₀</button>
<button class="btn btn-op" onclick="add('/')">÷</button>

<button class="btn" onclick="add('7')">7</button>
<button class="btn" onclick="add('8')">8</button>
<button class="btn" onclick="add('9')">9</button>
<button class="btn btn-op" onclick="add('*')">×</button>

<button class="btn" onclick="add('4')">4</button>
<button class="btn" onclick="add('5')">5</button>
<button class="btn" onclick="add('6')">6</button>
<button class="btn btn-op" onclick="add('-')">-</button>

<button class="btn" onclick="add('1')">1</button>
<button class="btn" onclick="add('2')">2</button>
<button class="btn" onclick="add('3')">3</button>
<button class="btn btn-op" onclick="add('+')">+</button>

<button class="btn btn-op" onclick="math('ln')">ln</button>
<button class="btn" onclick="add('0')">0</button>
<button class="btn" onclick="add('.')">.</button>
<button class="btn btn-eq" onclick="solve()">=</button>

</div>

<!-- TRIG -->
<div id="phase-trig" class="button-grid phase" style="display:none">

<button class="btn btn-ac" onclick="reset()">AC</button>
<button class="btn btn-op" onclick="toggleUnit()" id="unit-btn">DEG</button>
<button class="btn btn-eq" onclick="solve()">=</button>

<button class="btn btn-op" onclick="math('sin')">sin</button>
<button class="btn btn-op" onclick="math('cos')">cos</button>
<button class="btn btn-op" onclick="math('tan')">tan</button>

</div>

</div>

<script>

let input = "";
let isDeg = true;

function add(v) {
    if (input === "Error") input = "";
    input += v;
    update();
}

function update() {
    document.getElementById('output').innerText = input || "0";

    try {
        let live = eval(input);
        if (input !== "" && !isNaN(live)) {
            document.getElementById('history').innerText =
                "= " + (live.toString().includes('.') ? live.toFixed(4) : live);
        } else {
            document.getElementById('history').innerText = "";
        }
    } catch {
        document.getElementById('history').innerText = "";
    }
}

function reset() {
    input = "";
    document.getElementById('history').innerText = "";
    update();
}

function backspace() {
    input = input.slice(0, -1);
    update();
}

function changePhase(p) {
    document.querySelectorAll('.phase').forEach(el => el.style.display = 'none');
    document.getElementById('phase-' + p).style.display = 'grid';
}

function solve() {
    try {
        let res = eval(input);
        document.getElementById('history').innerText = input + " =";
        input = res.toString();
        update();
    } catch {
        input = "Error";
        update();
    }
}

function math(type) {
    let val = parseFloat(input || "0");
    let res = 0;

    const toRad = isDeg ? Math.PI / 180 : 1;

    if (type === 'sin') res = Math.sin(val * toRad);
    if (type === 'cos') res = Math.cos(val * toRad);
    if (type === 'tan') res = Math.tan(val * toRad);
    if (type === 'log') res = Math.log10(val);
    if (type === 'ln') res = Math.log(val);

    input = res.toFixed(4);
    update();
}

function toggleUnit() {
    isDeg = !isDeg;
    document.getElementById('unit-btn').innerText = isDeg ? "DEG" : "RAD";
}

</script>

</body>
</html>
