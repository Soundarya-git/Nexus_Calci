<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Calc | Advanced Studio</title>
    <style>
        :root {
            --bg: #0b0e14;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --danger: #ff4b5c;
            --text: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1c2c 0%, #0b0e14 100%);
            color: var(--text);
        }

        /* The Main Console */
        .calc-card {
            width: 420px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), 
                        inset 0 0 20px rgba(255,255,255,0.02);
        }

        /* Phase Navigation */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 20px;
        }

        .nav-tabs button {
            flex: 1;
            background: transparent;
            border: none;
            color: #666;
            padding: 10px 5px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 15px;
        }

        .nav-tabs button.active {
            color: var(--accent);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Screen Display */
        .screen {
            background: rgba(0,0,0,0.3);
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: right;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        #history { font-size: 14px; color: var(--accent); opacity: 0.6; min-height: 20px; margin-bottom: 8px; }
        #output { font-size: 42px; font-weight: 200; letter-spacing: -1px; }

        /* Button Styling & Shadow Animations */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .btn {
            height: 62px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.3), 
                        -2px -2px 10px rgba(255,255,255,0.02);
        }

        /* Shadow Hover Animation */
        .btn:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), 
                        0 0 12px var(--accent-glow);
            border-color: var(--accent);
        }

        /* Active Pressed Shadow */
        .btn:active {
            transform: translateY(1px);
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5), 
                        inset -2px -2px 8px rgba(255,255,255,0.01);
        }

        .btn-ac { color: var(--danger); font-weight: bold; border-color: rgba(255, 75, 92, 0.2); }
        .btn-op { color: var(--accent); font-weight: bold; }
        .btn-eq { background: var(--accent) !important; color: #000 !important; font-weight: bold; }
        
        .stats-field {
            grid-column: span 4;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--accent);
            padding: 18px;
            border-radius: 20px;
            color: #fff;
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            box-shadow: inset 0 0 10px var(--accent-glow);
        }
    </style>
</head>
<body>

<div class="calc-card">
    <div class="nav-tabs">
        <button onclick="changePhase('sci')" class="active" id="tab-sci">Scientific</button>
        <button onclick="changePhase('trig')" id="tab-trig">Trig</button>
        <button onclick="changePhase('stats')" id="tab-stats">Statistics</button>
    </div>

    <div class="screen">
        <div id="history"></div>
        <div id="output">0</div>
    </div>

    <div id="phase-sci" class="button-grid phase">
        <button class="btn btn-ac" onclick="reset()">AC</button>
        <button class="btn btn-op" onclick="math('log')">log₁₀</button>
        <button class="btn btn-op" onclick="math('log2')">log₂</button>
        <button class="btn btn-op" onclick="add('/')">÷</button>
        
        <button class="btn" onclick="add('7')">7</button>
        <button class="btn" onclick="add('8')">8</button>
        <button class="btn" onclick="add('9')">9</button>
        <button class="btn btn-op" onclick="add('*')">×</button>
        
        <button class="btn" onclick="add('4')">4</button>
        <button class="btn" onclick="add('5')">5</button>
        <button class="btn" onclick="add('6')">6</button>
        <button class="btn btn-op" onclick="add('-')">-</button>
        
        <button class="btn" onclick="add('1')">1</button>
        <button class="btn" onclick="add('2')">2</button>
        <button class="btn" onclick="add('3')">3</button>
        <button class="btn btn-op" onclick="add('+')">+</button>
        
        <button class="btn btn-op" onclick="math('ln')">ln</button>
        <button class="btn" onclick="add('0')">0</button>
        <button class="btn" onclick="add('.')">.</button>
        <button class="btn btn-eq" onclick="solve()">=</button>
    </div>

        <div id="phase-trig" class="button-grid phase" style="display:none; grid-template-columns: repeat(3, 1fr);">
        <button class="btn btn-ac" onclick="reset()">AC</button>
        <button class="btn btn-op" onclick="toggleUnit()" id="unit-btn">DEG</button>
        <button class="btn btn-eq" onclick="solve()">=</button>

        <button class="btn btn-op" onclick="math('sin')">sin</button>
        <button class="btn btn-op" onclick="math('cos')">cos</button>
        <button class="btn btn-op" onclick="math('tan')">tan</button>

        <button class="btn btn-op" onclick="math('asin')">asin</button>
        <button class="btn btn-op" onclick="math('acos')">acos</button>
        <button class="btn btn-op" onclick="math('atan')">atan</button>

        <button class="btn btn-op" onclick="math('sinh')">sinh</button>
        <button class="btn btn-op" onclick="math('cosh')">cosh</button>
        <button class="btn btn-op" onclick="math('tanh')">tanh</button>
    </div>


    <div id="phase-stats" class="button-grid phase" style="display:none">
        <input type="text" id="data-set" class="stats-field" placeholder="Numbers: 1, 2, 3...">
        <button class="btn btn-ac" style="grid-column: span 4" onclick="resetStats()">AC / CLEAR DATA</button>
        <button class="btn btn-op" style="grid-column: span 2" onclick="runStats('mean')">MEAN (μ)</button>
        <button class="btn btn-op" style="grid-column: span 2" onclick="runStats('sd')">STD DEV (σ)</button>
        <button class="btn btn-op" style="grid-column: span 4" onclick="runStats('var')">VARIANCE (σ²)</button>
    </div>
</div>

<script>
    let input = "";
    let isDeg = true;

    function add(v) {
        if(input === "Error") input = "";
        input += v;
        update();
    }

    function update() {
        document.getElementById('output').innerText = input || "0";
    }

    function reset() {
        input = "";
        document.getElementById('history').innerText = "";
        update();
    }

    function changePhase(p) {
        document.querySelectorAll('.phase').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
        document.getElementById('phase-' + p).style.display = 'grid';
        document.getElementById('tab-' + p).classList.add('active');
    }

    function solve() {
        try {
            let res = eval(input);
            document.getElementById('history').innerText = input + " =";
            input = res.toString().includes('.') ? res.toFixed(4) : res.toString();
            update();
        } catch {
            input = "Error";
            update();
        }
    }

        function math(type) {
        let val = parseFloat(input || "0");
        let res = 0;
        
        // Conversion factor
        const toRad = isDeg ? Math.PI / 180 : 1;
        const toDeg = isDeg ? 180 / Math.PI : 1;

        switch(type) {
            case 'log': res = Math.log10(val); break;
            case 'log2': res = Math.log2(val); break;
            case 'ln': res = Math.log(val); break;
            
            // Standard
            case 'sin': res = Math.sin(val * toRad); break;
            case 'cos': res = Math.cos(val * toRad); break;
            case 'tan': res = Math.tan(val * toRad); break;
            
            // Inverse (outputs degrees if isDeg is true)
            case 'asin': res = Math.asin(val) * toDeg; break;
            case 'acos': res = Math.acos(val) * toDeg; break;
            case 'atan': res = Math.atan(val) * toDeg; break;
            
            // Hyperbolic
            case 'sinh': res = Math.sinh(val); break;
            case 'cosh': res = Math.cosh(val); break;
            case 'tanh': res = Math.tanh(val); break;
        }
        
        document.getElementById('history').innerText = type + "(" + val + ")";
        input = res.toFixed(4);
        update();
    }


    function toggleUnit() {
        isDeg = !isDeg;
        document.getElementById('unit-btn').innerText = isDeg ? "DEG" : "RAD";
    }

    function resetStats() {
        document.getElementById('data-set').value = "";
        reset();
    }

    function runStats(type) {
        let raw = document.getElementById('data-set').value;
        let arr = raw.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
        if(arr.length === 0) return;

        let mean = arr.reduce((a,b) => a+b)/arr.length;
        let vari = arr.reduce((a,b) => a + Math.pow(b-mean, 2), 0)/arr.length;
        
        if(type === 'mean') input = mean.toFixed(3);
        else if(type === 'sd') input = Math.sqrt(vari).toFixed(3);
        else if(type === 'var') input = vari.toFixed(3);
        
        document.getElementById('history').innerText = type.toUpperCase() + " (n=" + arr.length + ")";
        update();
    }
</script>
</body>
</html>
