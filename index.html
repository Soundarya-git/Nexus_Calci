<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Calc | Advanced Studio</title>

<style>
:root {
    --bg: #0b0e14;
    --glass: rgba(255, 255, 255, 0.03);
    --accent: #00f2ff;
    --danger: #ff4b5c;
    --text: #e0e0e0;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI'; }

body {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle,#1a1c2c,#0b0e14);
    color:var(--text);
}

.calc-card {
    width:420px;
    padding:30px;
    border-radius:30px;
    background:var(--glass);
    backdrop-filter:blur(30px);
}

.nav-tabs {
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.nav-tabs button {
    flex:1;
    padding:10px;
    border:none;
    background:transparent;
    color:#777;
    border-radius:10px;
    cursor:pointer;
}

.nav-tabs button.active {
    color:var(--accent);
    background:rgba(255,255,255,0.05);
}

.screen {
    text-align:right;
    margin-bottom:25px;
}

#history {
    font-size:14px;
    color:var(--accent);
    min-height:20px;
}

#output {
    font-size:42px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.button-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.btn {
    height:60px;
    border-radius:15px;
    border:none;
    background:rgba(255,255,255,0.05);
    color:white;
    font-size:18px;
    cursor:pointer;
}

.btn-ac { color:var(--danger); }
.btn-op { color:var(--accent); }
.btn-eq { background:var(--accent); color:black; }

.stats-field {
    grid-column:span 4;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="calc-card">

<div class="nav-tabs">
<button onclick="changePhase('sci')" class="active" id="tab-sci">Scientific</button>
<button onclick="changePhase('trig')" id="tab-trig">Trig</button>
<button onclick="changePhase('stats')" id="tab-stats">Statistics</button>
</div>

<div class="screen">
<div id="history"></div>
<div id="output">0</div>
</div>

<!-- SCI -->
<div id="phase-sci" class="button-grid phase">

<button class="btn btn-ac" onclick="reset()">AC</button>
<button class="btn btn-op" onclick="backspace()">⌫</button>
<button class="btn btn-op" onclick="math('log')">log₁₀</button>
<button class="btn btn-op" onclick="math('log2')">log₂</button>

<button class="btn btn-op" onclick="add('/')">÷</button>
<button class="btn" onclick="add('7')">7</button>
<button class="btn" onclick="add('8')">8</button>
<button class="btn" onclick="add('9')">9</button>

<button class="btn btn-op" onclick="add('*')">×</button>
<button class="btn" onclick="add('4')">4</button>
<button class="btn" onclick="add('5')">5</button>
<button class="btn" onclick="add('6')">6</button>

<button class="btn btn-op" onclick="add('-')">-</button>
<button class="btn" onclick="add('1')">1</button>
<button class="btn" onclick="add('2')">2</button>
<button class="btn" onclick="add('3')">3</button>

<button class="btn btn-op" onclick="add('+')">+</button>
<button class="btn btn-op" onclick="math('ln')">ln</button>
<button class="btn" onclick="add('0')">0</button>
<button class="btn" onclick="add('.')">.</button>

<button class="btn btn-eq" style="grid-column: span 4" onclick="solve()">=</button>

</div>

<!-- TRIG -->
<div id="phase-trig" class="button-grid phase" style="display:none">
<button class="btn btn-ac" onclick="reset()">AC</button>
<button class="btn btn-op" onclick="toggleUnit()" id="unit-btn">DEG</button>
<button class="btn btn-eq" onclick="solve()">=</button>

<button class="btn btn-op" onclick="math('sin')">sin</button>
<button class="btn btn-op" onclick="math('cos')">cos</button>
<button class="btn btn-op" onclick="math('tan')">tan</button>
</div>

<!-- STATS -->
<div id="phase-stats" class="button-grid phase" style="display:none">
<input type="text" id="data-set" class="stats-field" placeholder="Numbers: 1,2,3">

<button class="btn btn-ac" style="grid-column: span 4" onclick="resetStats()">CLEAR</button>

<button class="btn btn-op" style="grid-column: span 2" onclick="runStats('mean')">MEAN</button>
<button class="btn btn-op" style="grid-column: span 2" onclick="runStats('sd')">STD DEV</button>

<button class="btn btn-op" style="grid-column: span 4" onclick="runStats('var')">VARIANCE</button>
</div>

</div>

<script>

let input="";
let isDeg=true;

function add(v){
input+=v;
update();
}

function update(){
const out=document.getElementById('output');
out.innerText=input||"0";

let len=(input||"0").length;
if(len>14) out.style.fontSize="22px";
else if(len>10) out.style.fontSize="28px";
else if(len>7) out.style.fontSize="34px";
else out.style.fontSize="42px";

try{
let live=eval(input);
document.getElementById('history').innerText="= "+live;
}catch{
document.getElementById('history').innerText="";
}
}

function reset(){ input=""; update(); }

function backspace(){ input=input.slice(0,-1); update(); }

function solve(){
try{ input=eval(input).toString(); update(); }
catch{ input="Error"; update(); }
}

function changePhase(p){
document.querySelectorAll('.phase').forEach(el=>el.style.display="none");
document.querySelectorAll('.nav-tabs button').forEach(el=>el.classList.remove('active'));
document.getElementById('phase-'+p).style.display="grid";
document.getElementById('tab-'+p).classList.add('active');
}

function math(type){
let val=parseFloat(input||0);
let r=0;
let rad=isDeg?Math.PI/180:1;

if(type==='sin') r=Math.sin(val*rad);
if(type==='cos') r=Math.cos(val*rad);
if(type==='tan') r=Math.tan(val*rad);

if(type==='log') r=Math.log10(val);
if(type==='log2') r=Math.log2(val);
if(type==='ln') r=Math.log(val);

input=r.toFixed(4);
update();
}

function toggleUnit(){
isDeg=!isDeg;
document.getElementById('unit-btn').innerText=isDeg?"DEG":"RAD";
}

function resetStats(){
document.getElementById('data-set').value="";
reset();
}

function runStats(type){
let arr=document.getElementById('data-set').value.split(/[, ]+/).map(Number);

let mean=arr.reduce((a,b)=>a+b)/arr.length;
let vari=arr.reduce((a,b)=>a+(b-mean)**2,0)/arr.length;

if(type==='mean') input=mean.toFixed(3);
if(type==='sd') input=Math.sqrt(vari).toFixed(3);
if(type==='var') input=vari.toFixed(3);

update();
}

</script>

</body>
</html>
